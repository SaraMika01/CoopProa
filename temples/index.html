<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoopProa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <!-- This <nav> tag is used to create a navigation bar. 1-->
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid">
               <!-- This <a> tag is used to create a link to home page. 2-->
               <a class="navbar-brand" href="{{ url_for('inicio') }}"> CoopProa</a>
                <!-- This <button> tag is used to open the menu on small screens. 3-->
                <button class="navbar-toggler" type="button"data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- This <div> tag is used to group the menu links. 4-->
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <!-- This <a> tag is used to create a link to the sales page. 5-->
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('ventas') }}"> Ventas</a>
                        </li>
                        <!-- This <a> tag is used to create a link to the inventory page. 6-->
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('inventario') }}">Inventario </a>
                        </li>
                        <!-- This <a> tag is used to create a link to the suppliers page. -->
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('proveedores') }}"> Proveedores</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    <main class="page-container">
        <section class="hero-card">
            <div>
                <span class="eyebrow"> COOPPROA</span>
                <h1>Panel de gestión.</h1>
                <p>Administrá ventas, inventario y proveedores desde un solo lugar. </p>
            </div>
            <div class="hero-icon">
                <i class="bi bi-grid-1x2-fill"></i>
            </div>
        </section>
        <div class="row g-4 mt-2">
            <a href="{{ url_for('ventas') }}" class="dashboard-link">
                <div class="mini-card">
                    <i class="bi bi-cash-stack"></i>
                    <h2> Ventas del día: {{ resumen.ventas_hoy }} </h2>
                </div>
            </a>
            <a href="{{ url_for('inventario') }}" class="dashboard-link">
                <div class="mini-card">
                    <i class="bi bi-box-seam"></i>
                    <h2>Inventario: {{ resumen.productos }}</h2>
                </div>
            </a>
            <a href="{{ url_for('proveedores') }}" class="dashboard-link">
                <div class="mini-card">
                    <i class="bi bi-truck"></i>
                    <h2>Proveedores: {{ resumen.proveedores }}</h2>
                </div>
            </a>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</header>
